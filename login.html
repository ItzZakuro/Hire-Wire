<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css">
        <title>HireWire - Login</title>
        <style>
            .loginSection {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh;
                background-color: #f4f4f4;
            }
            .loginCard {
                background: white;
                padding: 50px 40px;
                border-top: 5px solid #a89676; 
                box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
                width: 100%;
                max-width: 450px;
            }
            .form-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.9em;
                margin-bottom: 30px;
            }
            .form-options a {
                color: #a89676;
                text-decoration: none;
            }
            .loginBtn {
                width: 100%;
                cursor: pointer;
            }
            .signup-link {
                text-align: center;
                margin-top: 25px;
                font-size: 0.9em;
                color: #555;
            }
            .signup-link a {
                color: #a89676;
                font-weight: bold;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container nav">
                <div class="logo">H / W<br>HIRE WIRE</div>
                <button class="menuBtn" id="menuBtn">Menu</button>
                <nav class="navLinks" id="navLinks">
                    <a href="main.html">Home</a>
                    <a href="job_listings_creation.html">Post Job</a>
                    <a href="job_listings.html">Job Listings</a>
                    <a href="candidate_listings.html">Candidate Listings</a>
                    <a href="candidate.html">Candidate Matching</a>
                    <a href="employer.html">Employee matching</a>
                    <a href="profile.html">Profile</a>
                    <a href="login.html">Log In</a>
                </nav>
            </div>
        </header>

        <section class="loginSection">
            <div class="loginCard">
                <h2 class="accent-title" style="font-size: 2rem; margin-bottom: 30px;">Welcome</h2>
                <form id="loginForm">
                    <div class="field">
                        <input type="email" id="loginEmail" placeholder="Email Address" required style="background: #f9f9f9;" />
                    </div>
                    <div class="field">
                        <input type="password" id="loginPassword" placeholder="Password" required style="background: #f9f9f9;" />
                    </div>
                    
                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" id="forgotPassword">Forgot Password?</a>
                    </div>

                    <button class="btn loginBtn" type="submit">Log In</button>
                    <div class="message" id="loginMessage" style="color: red; margin-top: 15px; text-align: center;"></div>
                </form>

                <div class="signup-link">
                    Don't have an account? <a href="register.html">Sign up here</a>
                </div>
            </div>
        </section>

        <script>
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault(); 
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                if (password.length < 6) {
                    loginMessage.textContent = "Invalid credentials. Please try again.";
                } else {
                    loginMessage.style.color = "green";
                    loginMessage.textContent = "Login successful! Redirecting...";                
                    setTimeout(() => {
                        window.location.href = "main.html"; 
                    }, 1500);
                }
            });
        </script>
    </body>
</html>
