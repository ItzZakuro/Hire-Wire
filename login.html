<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css">
        <title>HireWire - Login</title>
        <style>
            .loginSection {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh;
                background-color: #f4f4f4;
            }
            .loginCard {
                background: white;
                padding: 50px 40px;
                border-top: 5px solid #a89676; 
                box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
                width: 100%;
                max-width: 450px;
            }
            .form-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.9em;
                margin-bottom: 30px;
            }
            .form-options a {
                color: #a89676;
                text-decoration: none;
            }
            .loginBtn {
                width: 100%;
                cursor: pointer;
            }
            .signup-link {
                text-align: center;
                margin-top: 25px;
                font-size: 0.9em;
                color: #555;
            }
            .signup-link a {
                color: #a89676;
                font-weight: bold;
                text-decoration: none;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container nav">
                <div class="logo">
                    <svg viewBox="0 0 200 200" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#a89676" stroke-width="6"></polygon>
                        <path d="M 65 80 L 65 120 M 95 80 L 95 120 M 65 100 L 95 100" stroke="#fff" stroke-width="8" stroke-linecap="square" fill="none"></path>
                        <path d="M 102 80 L 112 120 L 122 100 L 132 120 L 142 80" stroke="#a89676" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path>
                    </svg>
                </div>
                <button class="menuBtn" id="menuBtn">Menu</button>
                <nav class="navLinks" id="navLinks">
                    <a href="main.html">Home</a>
                    <a href="job_listings_creation.html">Post Job</a>
                    <a href="my_jobs.html">My Posted Jobs</a> <a href="job_listings.html">Job Listings</a>
                    <a href="candidate_listings.html">Candidate Listings</a>
                    <a href="candidate.html">Candidate Matching</a>
                    <a href="employer.html">Employer matching</a>
                    <a href="profile.html">Profile</a>
                    <a href="login.html">Log In</a>
                </nav>
            </div>
        </header>

        <section class="loginSection">
            <div class="loginCard">
                <h2 class="accent-title" style="font-size: 2rem; margin-bottom: 30px;">Welcome</h2>
                <form id="loginForm">
                    <div class="field">
                        <input type="email" id="loginEmail" placeholder="Email Address" required style="background: #f9f9f9;" />
                    </div>
                    <div class="field">
                        <input type="password" id="loginPassword" placeholder="Password" required style="background: #f9f9f9;" />
                    </div>
                    
                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" id="forgotPassword">Forgot Password?</a>
                    </div>

                    <button class="btn loginBtn" type="submit">Log In</button>
                    <div class="message" id="loginMessage" style="color: red; margin-top: 15px; text-align: center;"></div>
                </form>

                <div class="signup-link">
                    Don't have an account? <a href="register.html">Sign up here</a>
                </div>
            </div>
        </section>

        <script>
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault(); 
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('currentUserId', data.user.id); 
                        localStorage.setItem('currentUserName', data.user.name);
                        localStorage.setItem('currentUserEmail', data.user.email);
                        localStorage.setItem('isMember', data.user.isMember); 

                        loginMessage.style.color = "green";
                        loginMessage.textContent = "Login successful! Redirecting...";                
                        setTimeout(() => {
                            window.location.href = "main.html"; 
                        }, 1000);
                    } else {

                        loginMessage.style.color = "red";
                        loginMessage.textContent = data.message || "Invalid credentials. Please try again.";
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loginMessage.style.color = "red";
                    loginMessage.textContent = "Server error. Please ensure server is running.";
                });
            });
        </script>
    </body>
</html>
