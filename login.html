<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css">
        <title>HireWire - Login</title>
        <style>
            .loginSection {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 70vh;
                background-color: #f4f4f4;
            }
            .loginCard {
                background: white;
                padding: 40px;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
                width: 100%;
                max-width: 400px;
            }
            .loginCard h2 {
                text-align: center;
                margin-bottom: 20px;
            }
            .form-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                font-size: 0.9em;
                margin-bottom: 20px;
            }
            .form-options label {
                display: flex;
                align-items: center;
                gap: 5px;
            }
            .loginBtn {
                width: 100%;
                cursor: pointer;
            }
            .signup-link {
                text-align: center;
                margin-top: 20px;
                font-size: 0.9em;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container nav">
                <div class="logo">HIRE WIRE</div>
                <button class="menuBtn" id="menuBtn">Menu</button>
                <nav class="navLinks" id="navLinks">
                    <a href="main.html">Home</a>
                    <a href="job_listings.html">Job Listings</a>
                    <a href="candidate_listings.html">Candidate Listings</a>
                    <a href="candidate.html">Candidate Matching</a>
                    <a href="employer.html">Employee matching</a>
                    <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
</nav>
            </div>
        </header>

        <section class="loginSection">
            <div class="loginCard">
                <h2>Welcome Back</h2>
                <form id="loginForm">
                    <div class="field">
                        <input type="email" id="loginEmail" placeholder="Email Address" required />
                    </div>
                    <div class="field">
                        <input type="password" id="loginPassword" placeholder="Password" required />
                    </div>
                    
                    <div class="form-options">
                        <label>
                            <input type="checkbox" id="rememberMe"> Remember me
                        </label>
                        <a href="#" id="forgotPassword">Forgot Password?</a>
                    </div>

                    <button class="btn loginBtn" type="submit">Log In</button>
                    <div class="message" id="loginMessage" style="color: red; margin-top: 10px; text-align: center;"></div>
                </form>

                <div class="signup-link">
                    Don't have an account? <a href="#">Sign up here</a>
                </div>
            </div>
        </section>

        <script>
            const loginForm = document.getElementById('loginForm');
            const loginMessage = document.getElementById('loginMessage');

            loginForm.addEventListener('submit', function(event) {
                event.preventDefault(); 
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                if (password.length < 6) {
                    loginMessage.textContent = "Invalid credentials. Please try again.";
                } else {
                    loginMessage.style.color = "green";
                    loginMessage.textContent = "Login successful! Redirecting...";                
                    setTimeout(() => {
                        window.location.href = "main.html"; 
                    }, 1500);
                }
            });
        </script>
    </body>
</html>
