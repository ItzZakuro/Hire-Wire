<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Candidate Listings</title>
    <style>
        .candidate-listings-section {
            padding: 40px 0;
            background-color: #f9f9f9;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap; 
        }

        .filter-bar input[type="text"],
        .filter-bar select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            flex: 1; 
            min-width: 200px;
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .candidate-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .candidate-card h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .candidate-card .skills {
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
        }

        /*.candidate-card .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }*/

        .candidate-card .experience {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            /*color: #555;*/
        }

        .candidate-card .location {
            flex-grow: 1; 
            margin-bottom: 20px;
        }

        .select-btn {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .select-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo">HIRE WIRE</div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings.html">Job Listings</a>
                <a href="candidate_listings.html">Candidate Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employee matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>

    <section class="candidate-listings-section">
        <div class="container">
            <h2 class="sectionTitle">Available Candidates</h2>
            <p class="sectionText">Browse all candidates or use the filters to find the perfect match.</p>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by candidate name, skills, or experience...">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="design">Design</option>
                    <option value="support">Support</option>
                </select>
            </div>

            <div class="candidate-grid" id="candidateGrid">
                </div>
        </div>
    </section>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', function () {
                navLinks.classList.toggle('show');
            });
        }

        const candidatesData = [
            { id: 1, name: 'Alex Carter', skills: ['HTML', 'CSS', 'JavaScript', 'React'], experience: '4 years', location: 'Sydney', category: 'frontend' },
            { id: 2, name: 'Priya Singh', skills: ['Recruitment', 'Employee Relations', 'Onboarding'], experience: '2 years', location: 'Melbourne', category: 'support' },
            { id: 3, name: 'Daniel Lee', skills: ['Java', 'Python', 'AWS', 'Docker'], experience: '5 years', location: 'Sydney', category: 'backend' },
            { id: 4, name: 'Sarah Chen', skills: ['Figma', 'Adobe XD', 'User Research'], experience: 'Graduate', location: 'Melbourne', category: 'design' },
            { id: 5, name: 'Emma Robinson', skills: ['Data Analysis', 'Data Collection', 'Environmental Monitoring'], experience: '5 years', location: 'Perth', category: 'support' },
            { id: 6, name: 'Bradley Bright', skills: ['Content Creation', 'Video Editing', 'Public Relations'], experience: '3 years', location: 'Sydney', category: 'design' }
        ];

        const candidateGrid = document.getElementById('candidateGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');

        function renderCandidates(candidatesToRender) {
            candidateGrid.innerHTML = ''; 

            if (candidatesToRender.length === 0) {
                candidateGrid.innerHTML = '<p>No candidates found matching your criteria.</p>';
                return;
            }

            candidatesToRender.forEach(candidate => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <h3>${candidate.name}</h3>
                    <div class="skills">${candidate.skills.join(', ')}</div>
                    <div class="experience">${candidate.experience}</div>
                    <div class="location">${candidate.location}</div>
                    <a href="#" class="select-btn">Select Candidate</a>
                `;
                candidateGrid.appendChild(card);
            });
        }

        function filterCandidates() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredCandidates = candidatesData.filter(candidate => {
                const matchesSearch = candidate.name.toLowerCase().includes(searchTerm) ||
                                      candidate.skills.some(skill => skill.toLowerCase().includes(searchTerm)) ||
                                      candidate.experience.toLowerCase().includes(searchTerm);
                
                const matchesCategory = selectedCategory === 'all' || candidate.category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            renderCandidates(filteredCandidates);
        }

        searchInput.addEventListener('input', filterCandidates);
        categoryFilter.addEventListener('change', filterCandidates);

        renderCandidates(candidatesData);
    </script>
</body>
</html>
