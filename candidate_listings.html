<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Candidate Listings</title>
    <style>
        .candidate-listings-section {
            padding: 100px 0;
            background-color: #fff;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap; 
        }

        .filter-bar input[type="text"],
        .filter-bar select {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 0;
            background: #f9f9f9;
            font-size: 1em;
            flex: 1; 
            min-width: 200px;
        }

        .candidate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .candidate-card {
            background: white;
            border: none;
            border-top: 5px solid #a89676; 
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            display: flex;
            flex-direction: column;
        }

        .candidate-card h3 {
            margin-bottom: 5px;
            color: #333;
            font-family: Impact, 'Arial Narrow', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .candidate-card .skills {
            font-weight: bold;
            color: #a89676;
            margin-bottom: 10px;
        }

        .candidate-card .experience {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            background: #f4f4f4;
            padding: 6px 10px;
            font-size: 0.85em;
        }

        .candidate-card .location {
            flex-grow: 1; 
            margin-bottom: 25px;
            color: #555;
        }

        .select-btn {
            background-color: #a89676;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .select-btn:hover {
            background-color: #8e7d60;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo">
                <svg viewBox="0 0 200 200" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#a89676" stroke-width="6"></polygon>
                    <path d="M 65 80 L 65 120 M 95 80 L 95 120 M 65 100 L 95 100" stroke="#fff" stroke-width="8" stroke-linecap="square" fill="none"></path>
                    <path d="M 102 80 L 112 120 L 122 100 L 132 120 L 142 80" stroke="#a89676" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path>
                </svg>
            </div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings_creation.html">Post Job</a>
                <a href="job_listings.html">Job Listings</a>
                <a href="candidate_listings.html">Candidate Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employer matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>

    <section class="candidate-listings-section">
        <div class="container">
            <h2 class="accent-title">Available Candidates</h2>
            <p class="sectionText" style="text-align: center; margin-bottom: 40px;">Browse all candidates or use the filters to find the perfect match.</p>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by candidate name, skills, or experience...">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="design">Design</option>
                    <option value="support">Support</option>
                </select>
            </div>

            <div class="candidate-grid" id="candidateGrid">
                </div>
        </div>
    </section>

    <script src="Backend/candidateKeyword.js"></script>
</body>
</html>
