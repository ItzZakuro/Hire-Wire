<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="main.css">
        <script src="main.js" defer></script> 
        <title>HireWire - Register</title>
        <style>
            .registerSection {
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 80vh;
                background-color: #f4f4f4;
                padding: 50px 0;
            }
            .registerCard {
                background: white;
                padding: 50px 40px;
                border-top: 5px solid #a89676; 
                box-shadow: 0 10px 30px rgba(0,0,0,0.08);
                width: 100%;
                max-width: 500px;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="container nav">
                <div class="logo">
                    <svg viewBox="0 0 200 200" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
                        <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#a89676" stroke-width="6"></polygon>
                        <path d="M 65 80 L 65 120 M 95 80 L 95 120 M 65 100 L 95 100" stroke="#fff" stroke-width="8" stroke-linecap="square" fill="none"></path>
                        <path d="M 102 80 L 112 120 L 122 100 L 132 120 L 142 80" stroke="#a89676" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path>
                    </svg>
                </div>
                <button class="menuBtn" id="menuBtn">Menu</button>
                <nav class="navLinks" id="navLinks">
                    <a href="main.html">Home</a>
                    <a href="job_listings_creation.html">Post Job</a>
                    <a href="my_jobs.html">My Posted Jobs</a> <a href="job_listings.html">Job Listings</a>
                    <a href="candidate_listings.html">Candidate Listings</a>
                    <a href="candidate.html">Candidate Matching</a>
                    <a href="employer.html">Employer matching</a>
                    <a href="profile.html">Profile</a>
                    <a href="login.html">Log In</a>
                </nav>
            </div>
        </header>

        <section class="registerSection">
            <div class="registerCard">
                <h2 class="accent-title" style="font-size: 2rem; margin-bottom: 30px; text-align: center;">Create Profile</h2>
                
                <form id="registerForm">
                    <input type="text" id="regName" placeholder="Full Name *" required style="background: #f9f9f9; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px;" />
                    <input type="email" id="regEmail" placeholder="Email Address *" required style="background: #f9f9f9; width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px;" />
                    <input type="password" id="regPassword" placeholder="Password *" required minlength="6" style="background: #f9f9f9; width: 100%; padding: 12px; margin-bottom: 25px; border: 1px solid #ddd; border-radius: 4px;" />
                    <button class="btn" type="submit" style="width: 100%; background: #504e4a; color: white; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">REGISTER</button>
                    <div class="message" id="regMessage" style="margin-top: 15px; text-align: center; font-weight: bold;"></div>
                </form>

                <div style="text-align: center; margin-top: 25px; font-size: 0.9em; color: #555;">
                    Already have an account? <a href="login.html" style="color: #a89676; font-weight: bold; text-decoration: none;">Log in here</a>
                </div>
            </div>
        </section>

        <script>
            const registerForm = document.getElementById('registerForm');
            const regMessage = document.getElementById('regMessage');

            registerForm.addEventListener('submit', function(event) {
                event.preventDefault(); 
                
                const name = document.getElementById('regName').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;

                fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        regMessage.style.color = "green";
                        regMessage.textContent = "Registration successful! Redirecting to login...";                
                        setTimeout(() => {
                            window.location.href = "login.html"; 
                        }, 1500);
                    } else {
                        regMessage.style.color = "red";
                        regMessage.textContent = data.message;
                    }
                })
                .catch(error => {
                    regMessage.style.color = "red";
                    regMessage.textContent = "Server error. Please try again later.";
                });
            });
        </script>
    </body>
</html>
