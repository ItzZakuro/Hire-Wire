<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Create Job Listings</title>
    <style>
        .job-creation-section {
            padding: 100px 0;
            background-color: #504e4a;
        }

        .accent-title, .sectionText {
            color: #fff;
        }

        #job-creation-form {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 40px;
            border-top: 5px solid #a89676;
        }

        #job-creation-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        #job-creation-form input, #job-creation-form textarea, #job-creation-form select {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #job-creation-form button {
            width: 100%;
        }
    </style>
    <script>
        if (!localStorage.getItem('currentUserName')) {
            alert('Please log in first!');
            window.location.href = 'login.html'; 
        }
    </script>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo">
                <svg viewBox="0 0 200 200" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#a89676" stroke-width="6"></polygon>
                    <path d="M 65 80 L 65 120 M 95 80 L 95 120 M 65 100 L 95 100" stroke="#fff" stroke-width="8" stroke-linecap="square" fill="none"></path>
                    <path d="M 102 80 L 112 120 L 122 100 L 132 120 L 142 80" stroke="#a89676" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path>
                </svg>
            </div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings_creation.html">Post Job</a>
                <a href="my_jobs.html">My Posted Jobs</a> <a href="job_listings.html">Job Listings</a>
                <a href="candidate_listings.html">Candidate Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employer matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>
    <section class="job-creation-section">
        <div class="container">
            <h2 class="accent-title">Create a Job Listing</h2>
            <p class="sectionText" style="text-align: center; margin-bottom: 40px;">Create new job opportunities and connect with skilled candidates.</p>
            
            <form id="job-creation-form">
                <label>Job Title</label>
                <input type="text" id="jobTitle" name="job-title" required>

                <label>Job Description</label>
                <textarea id="jobDescription" name="job-description" rows="6" required></textarea>

                <label>Company Name</label>
                <input type="text" id="companyName" name="company-name" required>

                <label>Location</label>
                <input type="text" id="location" name="location" required>

                 <label>Education Level</label>
                <input type="text" id="educationLevel" name="education-level" placeholder="e.g. Bachelor's Degree" required>
                
                <label>Required Skills</label>
                <input type="text" id="skills" name="skills" placeholder="e.g. Python, JavaScript, SQL" required>

                <label>Experience Level</label>
                <input type="text" id="experienceLevel" name="experience-level" placeholder="e.g. 2 years of experience" required>

                <label>Salary</label>
                <input type="text" id="salary" name="salary" placeholder="e.g. $5000/month" required>

                <label>Work Mode</label>
                <select id="workMode" required>
                    <option value="">Select work mode</option>
                    <option value="remote">Remote</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="onsite">On-site</option>
                </select>

                <button type="submit" class="btn postJob-btn">Post Job</button>
            </form>
        </div>
    </section>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', function () {
                navLinks.classList.toggle('show');
            });
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('job-creation-form'); 
        
            if (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault(); 
                    
                    // 🌟 核心修改点：在这里打包数据时，带上主人的编号！
                    const jobData = {
                        ownerId: localStorage.getItem('currentUserId') || '', // 👈 就是加了这一行！
                        jobTitle: document.getElementById('jobTitle') ? document.getElementById('jobTitle').value : '',
                        companyName: document.getElementById('companyName') ? document.getElementById('companyName').value : '',
                        jobDescription: document.getElementById('jobDescription') ? document.getElementById('jobDescription').value : '',
                        location: document.getElementById('location') ? document.getElementById('location').value : '',
                        education: document.getElementById('educationLevel') ? document.getElementById('educationLevel').value : '',
                        skills: document.getElementById('skills') ? document.getElementById('skills').value : '', 
                        experience: document.getElementById('experienceLevel') ? document.getElementById('experienceLevel').value : '', 
                        salary: document.getElementById('salary') ? document.getElementById('salary').value : '',
                        workMode: document.getElementById('workMode') ? document.getElementById('workMode').value : ''
                    };

                    fetch('/api/jobs/create', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(jobData)
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            alert('Job posted successfully!');
                            form.reset(); 
                            window.location.href = 'job_listings.html';
                        } else {
                            alert('Post failed: ' + data.error);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        alert('Please ensure the node server.js is running!');
                    });
                });
            }
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginLink = document.querySelector('nav.navLinks a[href="login.html"]');
            if (loginLink && localStorage.getItem('currentUserName')) {
                loginLink.textContent = 'Log Out';
                loginLink.href = 'javascript:void(0)'; 
                loginLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    // 🌟 登出时，把所有印章全部销毁清空
                    localStorage.removeItem('currentUserId'); // 👈 顺手加上这一行，绝缘更安全！
                    localStorage.removeItem('currentUserName');
                    localStorage.removeItem('currentUserEmail');
                    localStorage.removeItem('isMember');
                    
                    alert('You have been logged out!');
                    window.location.href = 'main.html'; 
                });
            }
        });
    </script>
</body>
</html>
