<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Create Job Listings</title>
    <style>
        /*.job-listing-form {

        .job-listing-creation-section {
            padding: 100px 0;
            background-color: #fff;
        }

        #job-creation-form {
            max-width: 700px;
            margin: auto;
            background: #f5f5f5;
            padding: 40px;
            border-top: 5px solid #a89676;
        }

        #job-creation-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        #job-creation-form input, #job-creation-form textarea, #job-creation-form select {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        #job-creation-form button {
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo">H / W<br>HIRE WIRE</div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings_creation.html">Post Job</a>
                <a href="job_listings.html">Job Listings</a>
                <a href="candidate_listings.html">Candidate Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employee matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>
    <section class="job-creation-section">
        <div class="container">
            <h2 class="accent-title">Create a Job Listing</h2>
            <p class="sectionText" style="text-align: center; margin-bottom: 40px;">Create new job opportunities and connect with skilled candidates.</p>
            
            <form id="job-creation-form">
                <label>Job Title</label>
                <input type="text" id="jobTitle" name="job-title" required>

                <label>Job Description</label>
                <textarea id="jobDescription" name="job-description" rows="6" required></textarea>

                <label>Company Name</label>
                <input type="text" id="companyName" name="company-name" required>

                <label>Location</label>
                <input type="text" id="location" name="location" required>

                 <label>Education Level</label>
                <select id="educationSelection" required>
                    <option value="">Select Education Level</option>
                    <option>Bachelors</option>
                    <option>Masters</option>
                    <option>Diploma</option>
                </select>
                
                <label>Required Skills</label>
                <input type="text" id="skills" name="skills" placeholder="e.g. Python, JavaScript, SQL" required>

                <label>Experience Level</label>
                <select id="experienceSelection" name="experience" required>
                    <option value="">Select experience level</option>
                    <option value="entry">Entry Level</option>
                    <option value="mid">Mid Level</option>
                    <option value="senior">Senior Level</option>
                </select>

                <label>Salary</label>
                <input type="text" id="salary" name="salary" placeholder="e.g. $5000/month" required>

                <label>Work Mode</label>
                <select id="workMode" required>
                    <option value="">Select work mode</option>
                    <option value="remote">Remote</option>
                    <option value="hybrid">Hybrid</option>
                    <option value="onsite">On-site</option>
                </select>

                <!-- <label for="skills">Required Skills</label>
                <input type="text" id="skills" name="skills" placeholder="e.g. Python, JavaScript, SQL" required> -->

                <!--<label for="experience">Experience Level</label>
                <select id="experienceSelection" name="experience" required>
                    <option value="">Select experience level</option>
                    <option value="entry">Entry Level</option>
                    <option value="mid">Mid Level</option>
                    <option value="senior">Senior Level</option>
                </select> -->

                <button type="submit" class="post-job-btn">Post Job</button>
            </form>
        </div>
    </section>
    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', function () {
                navLinks.classList.toggle('show');
            });
        }
        
        const jobCreationForm = document.getElementById('job-creation-form');
        jobCreationForm.addEventListener('submit', function (event) {
            event.preventDefault();
            alert('Job listing created successfully!');
            jobCreationForm.reset();
        });
    </script>
</body>
</html>
