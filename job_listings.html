<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Job Listings</title>
    <style>
        .job-listings-section {
            padding: 100px 0;
            background-color: #fff;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-bar input[type="text"] {
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 0;
            background: #f9f9f9;
            font-size: 1em;
            flex: 1;
            min-width: 220px;
        }

        .filter-toggle {
            padding: 15px 25px;
            border: none;
            background-color: #a89676;
            color: white;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        .filter-toggle:hover {
            background-color: #8e7d60;
        }

        .filter-panel {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 35px;
            padding: 25px;
            background: #f9f9f9;
            border-top: 5px solid #a89676;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .filter-panel.show {
            display: grid;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }

        .filter-group select {
            padding: 12px;
            border: 1px solid #ddd;
            background: white;
            font-size: 1em;
        }

        .clear-filters-btn {
            padding: 12px;
            border: none;
            background-color: #333;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            align-self: end;
        }

        .clear-filters-btn:hover {
            background-color: #111;
        }

        .results-count {
            margin-bottom: 20px;
            color: #555;
            font-weight: bold;
        }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        .job-card {
            background: white;
            border: none;
            border-top: 5px solid #a89676;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .job-card h3 {
            margin-bottom: 5px;
            color: #333;
            font-family: Impact, 'Arial Narrow', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .job-card .company {
            font-weight: bold;
            color: #a89676;
            margin-bottom: 10px;
        }

        .job-card .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .job-card .tag {
            background: #f4f4f4;
            padding: 6px 10px;
            font-size: 0.85em;
            color: #333;
        }

        .job-card .description {
            flex-grow: 1;
            margin-bottom: 25px;
            color: #555;
        }

        .apply-btn {
            background-color: #a89676;
            color: white;
            text-align: center;
            padding: 12px;
            text-decoration: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            transition: background-color 0.3s;
        }

        .apply-btn:hover {
            background-color: #8e7d60;
        }
    </style>
</head>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginLink = document.querySelector('nav.navLinks a[href="login.html"]');
    
        if (loginLink && localStorage.getItem('currentUserName')) {
            loginLink.textContent = 'Log Out';
            loginLink.href = 'javascript:void(0)';
    
            loginLink.addEventListener('click', (e) => {
                e.preventDefault();
    
                localStorage.removeItem('currentUserId');
                localStorage.removeItem('currentUserName');
                localStorage.removeItem('currentUserEmail');
                localStorage.removeItem('isMember');
    
                alert('You have been logged out!');
                window.location.href = 'main.html';
            });
        }
    });
    </script>
<body>
    <header>
        <div class="container nav">
            <div class="logo">
                <svg viewBox="0 0 200 200" width="110" height="110" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="100,20 180,100 100,180 20,100" fill="none" stroke="#a89676" stroke-width="6"></polygon>
                    <path d="M 65 80 L 65 120 M 95 80 L 95 120 M 65 100 L 95 100" stroke="#fff" stroke-width="8" stroke-linecap="square" fill="none"></path>
                    <path d="M 102 80 L 112 120 L 122 100 L 132 120 L 142 80" stroke="#a89676" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter" fill="none"></path>
                </svg>
            </div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings_creation.html">Post Job</a>
                <a href="my_jobs.html">My Posted Jobs</a> <a href="job_listings.html">Job Listings</a>
                <a href="candidate_listings.html">Candidate Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employer matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>

    <section class="job-listings-section">
        <div class="container">
            <h2 class="accent-title">Available Jobs</h2>
            <p class="sectionText" style="text-align: center; margin-bottom: 40px;">Browse all opportunities or use the filters to find the perfect match.</p>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by job title, skills, or company...">
                <button type="button" class="filter-toggle" id="filterToggle">Filter:</button>
            </div>

            <div class="filter-panel" id="filterPanel">
                <div class="filter-group">
                    <label for="locationFilter">Location</label>
                    <select id="locationFilter"><option value="all">All Locations</option></select>
                </div>
                <div class="filter-group">
                    <label for="skillsFilter">Required Skills</label>
                    <select id="skillsFilter"><option value="all">All Skills</option></select>
                </div>
                <div class="filter-group">
                    <label for="educationFilter">Minimum Education</label>
                    <select id="educationFilter"><option value="all">All Education Levels</option></select>
                </div>
                <div class="filter-group">
                    <label for="salaryFilter">Salary</label>
                    <select id="salaryFilter">
                        <option value="all">All Salaries</option>
                        <option value="0-50000">Below $50,000</option>
                        <option value="50000-75000">$50,000 - $75,000</option>
                        <option value="75000-100000">$75,000 - $100,000</option>
                        <option value="100000-125000">$100,000 - $125,000</option>
                        <option value="125000-999999999">Above $125,000</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="workModeFilter">Form of Work</label>
                    <select id="workModeFilter"><option value="all">All Work Modes</option></select>
                </div>
                <div class="filter-group">
                    <label for="companyFilter">Company Name</label>
                    <select id="companyFilter"><option value="all">All Companies</option></select>
                </div>
                <div class="filter-group">
                    <label for="assetsFilter">Company Assets</label>
                    <select id="assetsFilter"><option value="all">All Asset Ranges</option></select>
                </div>
                <div class="filter-group">
                    <label for="sectorFilter">Company Sector</label>
                    <select id="sectorFilter"><option value="all">All Sectors</option></select>
                </div>
                <button type="button" class="clear-filters-btn" id="clearFilters">Clear Filters</button>
            </div>

            <p class="results-count" id="resultsCount"></p>
            <div class="job-grid" id="jobGrid"></div>
        </div>
    </section>

    <script src="Backend/joblistingsKeywords.js"></script>
    <script src="Backend/fuzzy.js"></script>
    <script src="Backend/joblistingsFilter.js"></script>

</body>
</html>
