<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="main.css">
    <title>HireWire - Job Listings</title>
    <style>
        .job-listings-section {
            padding: 40px 0;
            background-color: #f9f9f9;
        }

        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap; 
        }

        .filter-bar input[type="text"],
        .filter-bar select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1em;
            flex: 1; 
            min-width: 200px;
        }

        .job-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .job-card h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .job-card .company {
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
        }

        .job-card .tags {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .job-card .tag {
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            color: #555;
        }

        .job-card .description {
            flex-grow: 1; 
            margin-bottom: 20px;
        }

        .apply-btn {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s;
        }

        .apply-btn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <header>
        <div class="container nav">
            <div class="logo">HIRE WIRE</div>
            <button class="menuBtn" id="menuBtn">Menu</button>
            <nav class="navLinks" id="navLinks">
                <a href="main.html">Home</a>
                <a href="job_listings.html">Job Listings</a>
                <a href="candidate.html">Candidate Matching</a>
                <a href="employer.html">Employee matching</a>
                <a href="profile.html">Profile</a>
                <a href="login.html">Log In</a>
            </nav>
        </div>
    </header>

    <section class="job-listings-section">
        <div class="container">
            <h2 class="sectionTitle">Available Jobs</h2>
            <p class="sectionText">Browse all opportunities or use the filters to find the perfect match.</p>

            <div class="filter-bar">
                <input type="text" id="searchInput" placeholder="Search by job title, skills, or company...">
                <select id="categoryFilter">
                    <option value="all">All Categories</option>
                    <option value="frontend">Frontend</option>
                    <option value="backend">Backend</option>
                    <option value="design">Design</option>
                    <option value="support">Support</option>
                </select>
            </div>

            <div class="job-grid" id="jobGrid">
                </div>
        </div>
    </section>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');
        if (menuBtn && navLinks) {
            menuBtn.addEventListener('click', function () {
                navLinks.classList.toggle('show');
            });
        }

        const jobsData = [
            { id: 1, title: 'Frontend Developer', company: 'Bright Web Solutions', location: 'Sydney', type: 'Full-time', category: 'frontend', description: 'Entry-level web development role for candidates with strong frontend fundamentals. React experience is a plus.' },
            { id: 2, title: 'UI/UX Designer', company: 'Pixel Forge', location: 'Melbourne', type: 'Part-time', category: 'design', description: 'Creative role focused on building clean and user-friendly digital interfaces. Figma proficiency required.' },
            { id: 3, title: 'Junior Backend Engineer', company: 'CodeNest', location: 'Brisbane', type: 'Graduate', category: 'backend', description: 'Great opportunity for graduates looking to grow in a supportive development team using Java and SQL.' },
            { id: 4, title: 'IT Support Analyst', company: 'TechBridge', location: 'Perth', type: 'Full-time', category: 'support', description: 'Help clients solve technical issues and maintain strong service experiences. Excellent communication skills needed.' },
            { id: 5, title: 'Senior Frontend Engineer', company: 'GlobalTech', location: 'Remote', type: 'Contract', category: 'frontend', description: 'Lead frontend architecture using Vue.js. 5+ years of experience required.' },
            { id: 6, title: 'Product Designer', company: 'InnovateCorp', location: 'Sydney', type: 'Full-time', category: 'design', description: 'End-to-end product design from user research to high-fidelity prototyping.' }
        ];

        const jobGrid = document.getElementById('jobGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');

        function renderJobs(jobsToRender) {
            jobGrid.innerHTML = ''; 

            if (jobsToRender.length === 0) {
                jobGrid.innerHTML = '<p>No jobs found matching your criteria.</p>';
                return;
            }

            jobsToRender.forEach(job => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <h3>${job.title}</h3>
                    <div class="company">${job.company}</div>
                    <div class="tags">
                        <span class="tag">${job.location}</span>
                        <span class="tag">${job.type}</span>
                    </div>
                    <p class="description">${job.description}</p>
                    <a href="#" class="apply-btn">Apply Now</a>
                `;
                jobGrid.appendChild(card);
            });
        }

        function filterJobs() {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categoryFilter.value;

            const filteredJobs = jobsData.filter(job => {
                const matchesSearch = job.title.toLowerCase().includes(searchTerm) ||
                                      job.company.toLowerCase().includes(searchTerm) ||
                                      job.description.toLowerCase().includes(searchTerm);
                
                const matchesCategory = selectedCategory === 'all' || job.category === selectedCategory;

                return matchesSearch && matchesCategory;
            });

            renderJobs(filteredJobs);
        }

        searchInput.addEventListener('input', filterJobs);
        categoryFilter.addEventListener('change', filterJobs);

        renderJobs(jobsData);
    </script>
</body>
</html>
